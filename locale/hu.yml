general: Graphics API Replacer
general_descr: 'Ez a modul modernebb, DirectX-et vagy OpenGL-t használó megjelenítési rendszerre vált, ami például
  a felvételkészítő programokkal javíthatja az együttműködést. Magát a kirajzolást továbbra is a processzor végzi,
  ezért teljesítménynövekedés nem várható.

  Ezek a beállítások az ablak felbontását adják meg; a kirajzolás felbontását a játékon belüli beállítások határozzák
  meg. A képarány a játék felbontásához igazodik, ezért a felvételeken is látható fekete sávok jelenhetnek meg.'
