general: Graphics API Replacer
general_descr: 'این ماژول سامانهٔ نمایش را با سامانه‌ای جدیدتر مبتنی بر DirectX یا OpenGL جایگزین می‌کند تا برای
  مثال سازگاری بهتری با نرم‌افزارهای ضبط داشته باشد. خود رندر همچنان توسط پردازنده انجام می‌شود؛ بنابراین نباید
  انتظار افزایش کارایی داشت.

  این گزینه‌ها وضوح پنجره را تعیین می‌کنند و تنظیمات داخل بازی وضوح رندر را مشخص می‌کنند. نسبت تصویر به وضوح داخل
  بازی وابسته است و ممکن است نوارهای سیاهی ایجاد کند که در ضبط نیز دیده شوند.'
