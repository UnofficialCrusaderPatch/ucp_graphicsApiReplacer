general: Graphics API Replacer
general_descr: 'Bu modül, görüntüleme sistemini DirectX veya OpenGL kullanan daha modern bir sistemle değiştirir.
  Bu, örneğin kayıt yazılımlarıyla daha iyi uyumluluk sağlayabilir. Görüntünün kendisi hâlâ işlemcide oluşturulur;
  bu yüzden performans artışı beklenmemelidir.

  Bu seçenekler pencere çözünürlüğünü, oyun içi seçenekler ise oluşturma çözünürlüğünü belirler. En-boy oranı oyun
  içi çözünürlüğe bağlıdır ve kayıtlarda da görünen siyah şeritler oluşabilir.'
