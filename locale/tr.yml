graphic: Grafik API seçenekleri
graphic_descr: DirectX ve OpenGL seçenekleri.
graphic.api: Grafik API’si
graphic.api_descr: Kullanılacak grafik API’si.
graphic.api_DirectX: DirectX 11
graphic.api_OpenGL: OpenGL (kullanımdan kaldırılıyor)
graphic.filterLinear: Doğrusal filtreleme
graphic.filterLinear_descr: Doğrusal doku filtresi uygular. Pencere ve oluşturma çözünürlüğü farklıysa görüntüyü
  iyileştirebilir.
graphic.vsync: VSync
graphic.vsync_descr: VSync’i etkinleştirir. Oluşturulan kare sayısını ekran yenileme hızına sınırlar. Harita kaydırma
  kısmen karelere bağlı olduğundan bunu da etkiler.
graphic.waitWithGLFinish: glFinish ile bekle
graphic.waitWithGLFinish_descr: OpenGL kullanılırken ekran tamponları değiştirildikten sonra glFinish çağırır. Hiçbir
  etkisi olmayabilir. Bu seçenek ileride kaldırılabilir.
graphic.pixFormat: Piksel biçimi
graphic.pixFormat_descr: Piksel renk biçimi. Sonuç her durumda 32 bit RGBA’ya dönüştürülür; ancak bu seçim yazılımsal
  görüntü oluşturucuyu ayarlar. ARGB1555 muhtemelen özgün doku biçimidir.
graphic.pixFormat_argb1555: ARGB1555
graphic.pixFormat_rgb565: RGB565
graphic.debug: API hata ayıklama
graphic.debug_descr: Hata ayıklama iletilerini etkinleştirir. Normal kullanımda kapalı olmalıdır. En azından DirectX
  için hata ayıklama kitaplıkları gereklidir.
graphic.debug_none: Yok
graphic.debug_enabled: Etkin (OpenGL için azaltılmış çıktı)
graphic.debug_debugContextEnabled: OpenGL hata ayıklama bağlamı oluştur
control: Kontrol
control_descr: Girdi kontrolü seçenekleri.
control.clipCursor: İmleci sınırla
control.clipCursor_descr: İmleci sürekli olarak pencerenin oyun alanıyla sınırlar. Aksi hâlde bu yalnızca fare düğmesi
  basılıyken gerçekleşir.
control.scrollActive: Kaydırma
control.scrollActive_descr: Ekran kenarında kaydırmayı etkinleştirir.
control.margin: Dış kaydırma payı
control.margin_descr: İmleç sınırlaması etkin olmayan pencere modlarında kaydırma alanını dışarı doğru genişleten
  pencere pikseli sayısı.
control.padding: İç kaydırma payı
control.padding_descr: Kaydırma alanını içeri doğru genişleten pencere pikseli sayısı.
